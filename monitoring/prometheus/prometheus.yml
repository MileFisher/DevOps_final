global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: web-application
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - web
        type: A
        port: 3000

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
      
rule_files:
  - /etc/prometheus/alerts.yml
