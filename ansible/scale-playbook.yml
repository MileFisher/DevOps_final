- name : Scale web service
  hosts: aws_ec2
  become: true
  vars: 
    web_replicas: "{{ web_replicas | mandatory }}"
    project_path: "/home/{{ ansible_user }}/app"

  tasks:
    - name: Ensure community.docker collection is installed
      delegate_to: localhost
      ansible.builtin.command: ansible-galaxy collection install community.docker
      run_once: true
      become: false

    - name: Check if certificate already exists
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ domain_names[0] }}/fullchain.pem"
      register: cert_data

    - name: Set SSL status for nginx config
      ansible.builtin.set_fact:
        ssl_enabled: "{{ cert_data.stat.exists }}"

    - name: Copy compose template file
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ project_path }}/compose.yml"
        mode: '0644'
        force: yes

    - name: Copy nginx template file
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: '0644'
        force: yes

    - name: Run docker compose up
      community.docker.docker_compose_v2:
        project_src: "{{ project_path }}"
        state: present
        pull: always
        recreate: auto
        scale:
          web: "{{ web_replicas | int }}"
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      become: true
